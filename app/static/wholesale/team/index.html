<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3B2A2F">
  <title>روز جملة: الموظفين</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/wholesale/trader/trader.css?v=8">
  <script src="/static/wholesale/team/team.js?v=1" defer></script>
  <script src="/static/wholesale/pw-toggle.js?v=1" defer></script>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <span class="brand">
        <span class="logo"><img src="/api/branding/logo" alt="روز" onerror="this.src='/static/icon.svg'"></span>
        <span><b>روز جملة</b><small id="who"></small></span>
      </span>
      <button class="btn ghost sm light-text" id="logout" hidden>خروج</button>
    </div>
    <div class="search-row" id="search-row" hidden>
      <input type="search" id="search" placeholder="دوّر على صنف" aria-label="دوّر على صنف" enterkeyhint="search">
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <div class="cart-bar" id="cart-bar" hidden>
    <button id="open-list"><span id="cart-bar-text"></span><b>القايمة</b></button>
  </div>

  <nav class="bottom-nav" id="bottom-nav" hidden aria-label="التنقل">
    <a href="#catalog" data-nav="catalog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16l-1.2-5H5.2L4 9Z"/><path d="M5.5 9v11h13V9M10 20v-5h4v5"/></svg><span>الأصناف</span></a>
    <a href="#list" data-nav="list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg><span>القايمة</span><i class="badge-num" id="list-count" hidden></i></a>
    <a href="#requests" data-nav="requests">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></svg><span>طلباتي</span></a>
    <a href="#notebook" data-nav="notebook" id="nav-notebook" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5V4Z"/><path d="M9 10h6M9 14h4"/></svg><span>الدفتر</span></a>
    <a href="#notices" data-nav="notices">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15L6 16Z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span>التنبيهات</span><i class="badge-num" id="notice-count" hidden></i></a>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
